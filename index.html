<html lang="de">
<head>

<body>

  <!-- ===== Splash-Screen ===== -->
  <div id="splash" class="splash-overlay">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <svg class="splash-logo-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="sLg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4ADE80"/>
              <stop offset="100%" stop-color="#16A34A"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="56" height="56" rx="16" fill="url(#sLg)"/>
          <rect x="26" y="14" width="8" height="32" rx="3" fill="#fff"/>
          <rect x="14" y="26" width="32" height="8" rx="3" fill="#fff"/>
        </svg>
      </div>
      <div class="splash-title">Gesundheits-App</div>
      <div class="splash-sub">für die ganze Familie</div>
    </div>
  </div>

  <!-- ===== App-Wurzel ===== -->
  <div id="app" aria-live="polite"></div>

  <!-- ===== Bottom-Navigation ===== -->
  <nav id="bottom-nav" class="bottom-nav" hidden></nav>

  <!-- ===== Linkes Menü (Drawer) ===== -->
  <div id="drawer-scrim" class="drawer-scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true"></aside>

  <script src="js/data.js?v=28"></script>
  <script src="js/content/foods.js?v=28"></script>

  <script src="js/content.js?v=28"></script>

  <script src="js/app/core.js?v=28"></script>
  <script src="js/app/screens-start.js?v=28"></script>
  <script src="js/app/ernaehrung.js?v=28"></script>
  <script src="js/app/wissen.js?v=28"></script>
  <script src="js/app/training.js?v=28"></script>
  <script src="js/app/tracker.js?v=28"></script>
  <script src="js/app/coach.js?v=28"></script>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW-Registrierung fehlgeschlagen:', err));
      });
    }
